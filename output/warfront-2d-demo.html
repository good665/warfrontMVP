<div id="wf2d">
 <div class="viz-row"><strong>WARFRONT · 2D 전투 시연</strong><span class="viz-badge">탑다운 · 임시 프로토타입</span></div>
 <div class="viz-row" style="margin:12px 0"><span id="wf-status" aria-live="polite">전투 준비</span><button class="btn btn-primary" id="wf-auto">자동 시연 시작</button><button class="btn" id="wf-skill">회전 베기</button><button class="btn" id="wf-reset">다시 시작</button></div>
 <canvas width="840" height="480" aria-label="2D 분대 전투. 전장 클릭으로 이동하고 회전 베기 버튼으로 주변 적을 공격합니다." class="cursor-interaction" style="width:100%;display:block;touch-action:manipulation;image-rendering:pixelated"></canvas>
 <div class="viz-row" style="margin-top:12px"><span>전장 클릭: 이동</span><span>근접 시 자동 공격</span><span>깃발: 점령 목표</span></div>
</div>
<script>
(()=>{
 const root=document.getElementById('wf2d'),c=root.querySelector('canvas'),g=c.getContext('2d'),status=root.querySelector('#wf-status'),auto=root.querySelector('#wf-auto');
 let p,enemies,allies,target,kills,t,hit,skill,playing=false,last=0,elapsed=0;
 const colors={};function palette(){const fallback={bg:'#f3f5ed',fg:'#202923',grass:'#448b50',path:'#d4c9a6',rock:'#727b74',ally:'#287bc1',enemy:'#ce4848',gold:'#c18b1a',armor:'#bac6cb',ink:'#202923'};for(const [k,v] of Object.entries({bg:'--background',fg:'--foreground',grass:'--green',path:'--muted',rock:'--muted-foreground',ally:'--blue',enemy:'--red',gold:'--yellow',armor:'--secondary',ink:'--foreground'})){let a=document.createElement('span');a.style.color='var('+v+', '+fallback[k]+')';root.append(a);colors[k]=getComputedStyle(a).color;a.remove();}}
 function reset(){p={x:180,y:250,hp:100,cd:0};allies=Array.from({length:4},(_,i)=>({x:115-(i%2)*25,y:210+Math.floor(i/2)*60,hp:100,cd:0}));enemies=Array.from({length:9},(_,i)=>({x:530+(i%3)*65,y:155+Math.floor(i/3)*80,hp:60,cd:0}));target={x:400,y:250};kills=0;t=0;hit=0;skill=0;elapsed=0;playing=false;auto.textContent='자동 시연 시작';updateStatus();draw();}
 function updateStatus(){status.textContent=p.hp<=0?'패배 · 다시 도전하세요':kills===9?'승리 · 거점 점령 완료':`생명력 ${Math.ceil(p.hp)} · 처치 ${kills}/9`;}
 function move(a,b,s,dt){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>3){a.x+=dx/d*Math.min(d,s*dt);a.y+=dy/d*Math.min(d,s*dt);}}
 function damage(e,n){if(e.hp<=0)return;e.hp-=n;if(e.hp<=0)kills++;}
 function slash(){if(p.hp<=0||skill>0||kills===9)return;skill=2.5;hit=.4;enemies.forEach(e=>{if(Math.hypot(e.x-p.x,e.y-p.y)<115)damage(e,45)});updateStatus();draw();}
 function actor(a,enemy,hero){if(a.hp<=0)return;let x=Math.round(a.x),y=Math.round(a.y+Math.sin(t*9+a.x)*2);g.globalAlpha=.18;g.fillStyle=colors.ink;g.beginPath();g.ellipse(x,y+18,17,6,0,0,7);g.fill();g.globalAlpha=1;g.fillStyle=enemy?colors.enemy:colors.ally;g.fillRect(x-11,y-3,22,20);g.fillStyle=colors.armor;g.fillRect(x-8,y-19,16,15);g.fillStyle=colors.ink;g.fillRect(x-5,y-12,10,3);g.fillRect(x-8,y+17,6,7);g.fillRect(x+3,y+17,6,7);g.fillStyle=colors.gold;g.fillRect(x+14,y-14,4,29);g.fillStyle=enemy?colors.enemy:colors.ally;g.fillRect(x-18,y-3,7,17);if(hero){g.strokeStyle=colors.gold;g.lineWidth=2;g.beginPath();g.ellipse(x,y+23,21,8,0,0,7);g.stroke();}g.globalAlpha=.25;g.fillStyle=colors.ink;g.fillRect(x-15,y-29,30,4);g.globalAlpha=1;g.fillStyle=enemy?colors.enemy:colors.ally;g.fillRect(x-15,y-29,30*Math.max(0,a.hp)/(enemy?60:100),4);}
 function draw(){g.clearRect(0,0,840,480);g.fillStyle=colors.bg;g.fillRect(0,0,840,480);g.globalAlpha=.2;g.fillStyle=colors.grass;g.fillRect(0,0,840,480);g.globalAlpha=1;g.fillStyle=colors.path;g.fillRect(0,218,840,70);g.fillRect(365,0,80,480);for(let i=0;i<85;i++){let x=(i*137+35)%840,y=(i*83+19)%480;if(y>190&&y<310||x>340&&x<470)continue;g.globalAlpha=.35;g.fillStyle=colors.grass;g.fillRect(x,y,3,9);g.fillRect(x-3,y+3,9,3);}g.globalAlpha=1;for(let i=0;i<12;i++){let x=(i*193+55)%820,y=i%2?425:47;g.fillStyle=colors.rock;g.fillRect(x,y,22,14);g.fillStyle=colors.grass;g.fillRect(x-9,y-25,40,32);g.fillRect(x-3,y-36,28,17);}g.strokeStyle=colors.gold;g.lineWidth=2;g.beginPath();g.arc(690,250,62,0,7);g.stroke();g.fillStyle=colors.rock;g.fillRect(689,185,5,78);g.fillStyle=kills===9?colors.ally:colors.enemy;g.fillRect(694,185,34,23);g.strokeStyle=colors.ally;g.beginPath();g.arc(target.x,target.y,10,0,7);g.stroke();[...allies.map(a=>({a,e:false})),...enemies.map(a=>({a,e:true})),{a:p,e:false,h:true}].sort((a,b)=>a.a.y-b.a.y).forEach(o=>actor(o.a,o.e,o.h));if(hit>0){g.strokeStyle=colors.gold;g.lineWidth=8;g.globalAlpha=hit/.4;g.beginPath();g.arc(p.x,p.y,95,t*8,t*8+5);g.stroke();g.globalAlpha=1;} }
 function tick(now){let dt=Math.min((now-last)/1000,.04);last=now;if(playing&&p.hp>0&&kills<9){t+=dt;elapsed+=dt;skill=Math.max(0,skill-dt);hit=Math.max(0,hit-dt);let living=enemies.filter(e=>e.hp>0);let nearest=living.reduce((a,e)=>!a||Math.hypot(e.x-p.x,e.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?e:a,null);move(p,target,95,dt);allies.forEach((a,i)=>{let e=living.reduce((a,e)=>!a||Math.hypot(e.x-p.x,e.y-p.y)<Math.hypot(a.x-p.x,a.y-p.y)?e:a,null);move(a,e&&Math.hypot(e.x-p.x,e.y-p.y)<160?e:{x:p.x-35-(i%2)*26,y:p.y+(i<2?-45:45)},100,dt);a.cd-=dt;if(e&&Math.hypot(e.x-a.x,e.y-a.y)<42&&a.cd<=0){damage(e,12);a.cd=.7}});p.cd-=dt;if(nearest&&Math.hypot(nearest.x-p.x,nearest.y-p.y)<65&&p.cd<=0){damage(nearest,20);p.cd=.5;hit=.15}enemies.forEach(e=>{if(e.hp<=0)return;move(e,p,35,dt);e.cd-=dt;if(Math.hypot(e.x-p.x,e.y-p.y)<32&&e.cd<=0){p.hp=Math.max(0,p.hp-3);e.cd=1.2}});if(autoMode){if(nearest)target={x:nearest.x,y:nearest.y};if(nearest&&Math.hypot(nearest.x-p.x,nearest.y-p.y)<100)slash();}if(kills===9){p.x=690;p.y=250;}updateStatus();}draw();requestAnimationFrame(tick);}
 let autoMode=true;auto.onclick=()=>{playing=!playing;autoMode=true;auto.textContent=playing?'일시정지':'자동 시연 시작';};root.querySelector('#wf-skill').onclick=slash;root.querySelector('#wf-reset').onclick=reset;c.onclick=e=>{let r=c.getBoundingClientRect();target={x:(e.clientX-r.left)*840/r.width,y:(e.clientY-r.top)*480/r.height};playing=true;autoMode=false;auto.textContent='자동 시연 시작';};palette();reset();requestAnimationFrame(tick);
})();
</script>
